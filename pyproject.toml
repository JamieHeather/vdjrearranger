[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vdjrearranger"
version = "0.1.0"
description = "Tool for producing synthetic 10X VDJ formatted FASTQ data"
requires-python = ">=3.10"

dependencies = [
    "typer>=0.12",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.scripts]
vdjrearranger = "vdjrearranger.cli:app"

[tool.setuptools.package-data]
vdjrearranger = ["whitelist/*.txt.gz"]